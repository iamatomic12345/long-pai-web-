# Render Blueprint for Long Pai — one web service: the Express API, which also serves frontend/.
# Secrets are entered in the Render dashboard (sync: false) — nothing secret lives here.
# PORT is not listed: Render sets it itself and the server reads process.env.PORT.
# Migrations and seed run in the build (the free plan has no pre-deploy step); both are
# safe to re-run, and a failure stops the deploy before the old version is replaced.
services:
  - type: web
    name: longpai
    runtime: node
    plan: free
    buildCommand: npm install && npm run migrate && npm run seed
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPABASE_BUCKET
        value: stories
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_EXPIRES_IN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_CALLBACK_URL
        sync: false
