<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ไม่พบหน้านี้ · long pai</title>
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@500;600&display=swap">
<style>
  /* the same tokens, logo and button styles as the app (frontend/index.html) */
  :root {
    --bg: oklch(0.985 0.012 78);
    --ink: oklch(0.26 0.028 55);
    --ink-soft: oklch(0.42 0.025 58);
    --muted: oklch(0.58 0.02 62);
    --primary: oklch(0.66 0.165 47);
    --primary-strong: oklch(0.59 0.17 43);
    --font-display: "Mitr", "IBM Plex Sans Thai", system-ui, sans-serif;
    --font-body: "IBM Plex Sans Thai", "Mitr", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  main { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; text-align: center; }
  .logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; margin-bottom: 36px; }
  .logo-mark { width: 46px; height: 46px; }
  .logo-mark img { width: 100%; height: 100%; object-fit: contain; display: block;
    transform: scale(1.24); filter: drop-shadow(0 3px 6px oklch(0.66 0.165 47 / 0.35)); }
  .logo-word { font-family: var(--font-display); font-weight: 600; font-size: 26px; letter-spacing: -0.02em; line-height: 1; color: var(--ink); }
  .logo-word .pai { color: var(--primary); }
  .code { font-family: var(--font-display); font-weight: 600; font-size: clamp(64px, 18vw, 112px); line-height: 1;
    color: var(--primary); letter-spacing: -0.03em; }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: 24px; margin: 14px 0 8px; letter-spacing: -0.01em; }
  p { color: var(--ink-soft); font-size: 15px; line-height: 1.6; margin: 0 auto 26px; max-width: 420px; }
  .btn { border: none; border-radius: 12px; padding: 12px 22px; font-weight: 600; font-size: 15px; font-family: inherit;
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none; white-space: nowrap;
    transition: transform .14s, box-shadow .14s, background .16s; }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px oklch(0.66 0.165 47 / 0.28); }
  .btn-primary:hover { background: var(--primary-strong); transform: translateY(-1px); box-shadow: 0 7px 18px oklch(0.66 0.165 47 / 0.34); }
  .btn svg { width: 17px; height: 17px; }
  .en { color: var(--muted); font-size: 13px; margin-top: 22px; }
</style>
</head>
<body>
<main>
  <div>
    <a class="logo" href="/" aria-label="LongPai — กลับหน้าแรก">
      <span class="logo-mark"><img src="/assets/logo.png" alt=""></span>
      <span class="logo-word">long<span class="pai">pai</span></span>
    </a>
    <div class="code">404</div>
    <h1>ไม่พบหน้านี้</h1>
    <p>ลิงก์อาจพิมพ์ผิด หรือหน้านี้ถูกย้ายไปแล้ว กลับไปเที่ยวต่อที่หน้าแรกได้เลย</p>
    <a class="btn btn-primary" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6 3 4v14l6 2 6-2 6 2V6l-6-2-6 2Zm0 0v14m6-12v14"/></svg>
      กลับหน้าแรก
    </a>
    <div class="en">Page not found · <a href="/" style="color: inherit">Back to Long Pai</a></div>
  </div>
</main>
</body>
</html>
